<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SIDETRACKS · Live</title>
<meta name="description" content="The live window into the Grand Library of O: SIDETRACKS, broadcast from the ꞶꝈƖꞴ Station.">
<style>
  :root{--gold:#e8c46a;--ink:#05070c;--dim:#8a7fa8}
  html,body{margin:0;height:100%;background:var(--ink);color:var(--gold);font-family:Georgia,serif}
  /* the player fills the width at 16:9 and sits at the TOP, so the rest of the phone is free for the chat below */
  .player{position:relative;width:100%;aspect-ratio:16/9;background:#000}
  .player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .bar{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
  .bar a{color:var(--dim);text-decoration:none}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#e02424;margin-right:6px;vertical-align:middle}
</style>
</head>
<body>
  <div class="player">
    <!-- always shows whatever is live right now on Creature Fantastica (@10DimensionsofO) -->
    <iframe src="https://www.youtube.com/embed/live_stream?channel=UC0flZDf4y_JixrHykgW9Myg&autoplay=1&mute=1&playsinline=1"
            title="SIDETRACKS live" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>
  </div>
  <div class="bar"><span><span class="dot"></span>SIDETRACKS · ꞶꝈƖꞴ</span><a href="https://www.youtube.com/@10DimensionsofO/live">open in YouTube</a></div>
</body>
